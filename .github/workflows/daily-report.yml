name: Daily FII/DII Decode Report

on:
  schedule:
    # 21:00 IST = 15:30 UTC. GitHub cron is UTC. Runs Mon-Fri.
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      demo:
        description: "Run in demo mode (use fixtures, no NSE fetch)"
        type: boolean
        default: false
      no_email:
        description: "Skip sending email"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run decode + generate + email report
        env:
          PYTHONPATH: src
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          DEMO_FLAG=""
          EMAIL_FLAG=""
          if [ "${{ github.event.inputs.demo }}" = "true" ]; then DEMO_FLAG="--demo"; fi
          if [ "${{ github.event.inputs.no_email }}" = "true" ]; then EMAIL_FLAG="--no-email"; fi
          python -m fiidii.cli run --symbol NIFTY $DEMO_FLAG $EMAIL_FLAG

      - name: Commit data + reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily decode report $(date -u +%Y-%m-%d)"
            git push origin ${{ github.ref_name }}
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiidii-report
          path: reports/
          retention-days: 30
